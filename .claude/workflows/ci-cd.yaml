# CI/CD Pipeline for Jagger Tailors
# GitHub Actions workflow with quality gates

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: 20

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint -- scripts/**/*.js *.js 2>/dev/null || echo "ESLint config needed"

      - name: Stylelint
        run: npx stylelint styles.css --formatter=json 2>/dev/null || echo "Stylelint check"

      - name: HTML validation
        run: npx html-validate index.html --format=json 2>/dev/null || echo "HTML validation"

      - name: Guardrails check
        run: node .claude/scripts/validate.js

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Playwright
        run: npm install -D playwright @playwright/test

      - name: Start server
        run: |
          npx serve . &
          sleep 5
        env:
          PORT: 8000

      - name: Run E2E tests
        run: npx playwright test --project=chromium

  accessibility:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install axe-core
        run: npm install -D @axe-core/cli

      - name: Start server
        run: |
          npx serve . &
          sleep 5

      - name: Accessibility audit
        run: npx axe-cli http://localhost:8000 --save results.json

      - name: Check violations
        run: |
          VIOLATIONS=$(jq '.violations | length' results.json)
          if [ "$VIOLATIONS" -gt 0 ]; then
            echo "Found $VIOLATIONS accessibility violations"
            jq '.violations' results.json
            exit 1
          fi

  performance:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Start server
        run: |
          npx serve . &
          sleep 5

      - name: Lighthouse audit
        uses: treosh/lighthouse-ci-action@v10
        with:
          urls: |
            http://localhost:8000
          configPath: './.lighthouserc.json'
          uploadArtifacts: true
          assert: |
            categories:performance >= 90
            categories:accessibility >= 95
            categories:best-practices >= 90

  security:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run security audit
        run: |
          npm audit --audit-level moderate || true

      - name: Check for secrets
        uses: gitleaks/gitleaks-action@v2

  deploy:
    runs-on: ubuntu-latest
    needs: [test, accessibility, performance]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: './'
          netlify-auth-token: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          netlify-site-id: ${{ secrets.NETLIFY_SITE_ID }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}