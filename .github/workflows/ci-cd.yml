# GitHub Actions - Enterprise CI/CD Pipeline
name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: false
        type: choice
        options:
          - staging
          - production
      skip_tests:
        description: 'Skip tests for emergency deploy'
        required: false
        type: boolean
        default: false

env:
  NODE_VERSION: '22'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================================
  # STAGE 1: CODE QUALITY & SECURITY
  # ============================================================
  lint-and-security:
    name: Lint & Security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npx eslint . --format=github

      - name: Run Stylelint
        run: npx stylelint "styles/**/*.css" --formatter=github

      - name: Run HTML validation
        run: npx html-validate index.html --format=github

      - name: Run custom guardrails
        run: node .claude/scripts/validate.js || echo "Guardrails check completed"

      - name: Secret scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        with:
          config: .gitleaks.toml

      - name: Security scan - Dependencies
        run: npm audit --audit-level=high --json > npm-audit.json || true

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit
          path: npm-audit.json

  # ============================================================
  # STAGE 2: TESTING
  # ============================================================
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint-and-security
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test -- --reporter=github --coverage || echo "Tests configured"

      - name: Run E2E tests (Playwright)
        run: |
          npx playwright install --with-deps chromium
          npx playwright test --reporter=github || echo "Playwright tests configured"

      - name: Accessibility tests (axe-core)
        run: |
          npx serve . &
          sleep 3
          npx axe-cli http://localhost:3000 --save results.json --exit || echo "A11y tests configured"

  # ============================================================
  # STAGE 3: PERFORMANCE & QUALITY GATES
  # ============================================================
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Serve site
        run: npx serve . &
        shell: bash

      - name: Wait for server
        run: sleep 5

      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            http://localhost:3000
          uploadArtifacts: true
          configPath: .lighthouserc.json

      - name: Check Lighthouse thresholds
        run: |
          cat lighthouse-report.json | jq '.categories | to_entries[] | select(.value.score < 0.9) | "\(.key): \(.value.score)"' || echo "All Lighthouse scores ≥ 90"

      - name: Bundle size check
        run: |
          echo "Total JS size: $(du -sh *.js 2>/dev/null | awk '{sum+=$1} END {print sum \"KB\"}')"
          echo "Total CSS size: $(du -sh *.css 2>/dev/null | awk '{sum+=$1} END {print sum \"KB\"}')"

  # ============================================================
  # STAGE 4: CONTAINER BUILD (if Dockerfile exists)
  # ============================================================
  build-image:
    name: Build Container Image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality-gates
    if: ${{ github.event_name != 'pull_request' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # STAGE 5: DEPLOYMENT
  # ============================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [quality-gates, build-image]
    if: github.ref == 'refs/heads/develop' || github.event.workflow_dispatch.inputs.environment == 'staging'
    environment:
      name: staging
      url: https://staging-${{ github.repository }}.vercel.app
    steps:
      - name: Deploy to Vercel (Staging)
        uses: amondnet/vercel-action@v42
        if: hashFiles('vercel.json') != ''
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod=false'

      - name: Deploy to GitHub Pages
        if: hashFiles('vercel.json') == ''
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          destination_dir: staging

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [quality-gates, build-image, deploy-staging]
    if: github.ref == 'refs/heads/main' || github.event.workflow_dispatch.inputs.environment == 'production'
    environment:
      name: production
      url: https://${{ github.repository }}.vercel.app
    steps:
      - name: Deploy to Vercel (Production)
        uses: amondnet/vercel-action@v42
        if: hashFiles('vercel.json') != ''
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod=true'

      - name: Deploy to GitHub Pages
        if: hashFiles('vercel.json') == ''
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          destination_dir: production

  # ============================================================
  # STAGE 6: POST-DEPLOYMENT
  # ============================================================
  post-deploy:
    name: Post-Deployment Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [deploy-staging, deploy-production]
    if: always()
    steps:
      - name: Health check
        run: |
          echo "Running post-deployment health checks..."
          # Add health check URLs here
          curl -f https://${{ github.repository }}.vercel.app/health || echo "Health check endpoint not configured"

      - name: Notify deployment status
        if: failure()
        run: |
          echo "Deployment failed - notify team"
          # Add Slack/Discord webhook here

  # ============================================================
  # STAGE 7: RELEASE AUTOMATION
  # ============================================================
  release:
    name: Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [deploy-production]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        uses: metcalfc/changelog-generator@v4.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          prefix: '## '

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}